<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <title>广论消文编辑器</title>
    <style>
      :root {
        --ink: #1a1208;
        --ink-light: #4a3c28;
        --ink-faint: #6b5c44;
        --paper: #f5f0e8;
        --paper-warm: #ede6d6;
        --divider: #c8b896;
        --gold: #96721a;
        --gold-light: #d4aa4a;
        --gold-pale: #f0e4c0;
        --green: #3a6040;
        --green-light: #4a7a52;
        --shadow: rgba(80, 60, 20, 0.14);
        --radius: 10px;
        --tap: 40px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--paper);
        color: var(--ink);
        font-family: "Noto Sans SC", sans-serif;
        font-size: 17px;
        line-height: 1.6;
        min-height: 100vh;
      }

      /* ── Top bar ── */
      .top-bar {
        background: var(--ink);
        position: sticky;
        top: 0;
        z-index: 100;
        padding: 0 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        height: 54px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
      }

      .btn-back {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(184, 145, 42, 0.35);
        color: var(--gold-light);
        border-radius: 8px;
        padding: 8px 14px;
        min-height: var(--tap);
        font-size: 15px;
        cursor: pointer;
        font-family: "Noto Sans SC", sans-serif;
        flex-shrink: 0;
        transition: background 0.15s;
      }

      .btn-back:hover {
        background: rgba(255, 255, 255, 0.15);
      }

      .top-title {
        color: var(--gold-light);
        font-family: "Noto Serif SC", serif;
        font-size: 17px;
        letter-spacing: 1px;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ── Meta section ── */
      .meta-section {
        background: var(--paper-warm);
        border-bottom: 2px solid var(--divider);
        padding: 10px 16px;
      }

      .meta-inner {
        max-width: 920px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: end;
      }

      .meta-fields {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .meta-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .meta-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--gold);
        letter-spacing: 1px;
      }

      .meta-input {
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid var(--divider);
        border-radius: 8px;
        padding: 8px 12px;
        min-height: var(--tap);
        font-family: "Noto Serif SC", serif;
        font-size: 17px;
        color: var(--ink);
        outline: none;
        transition: border-color 0.15s;
        width: 100%;
      }

      .meta-input:focus {
        border-color: var(--gold);
        background: white;
      }

      .meta-date-col {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 160px;
      }

      /* ── Main content ── */
      main {
        max-width: 920px;
        margin: 0 auto;
        padding: 14px 16px 90px;
      }

      .list-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }

      .list-count {
        font-size: 14px;
        color: var(--ink-faint);
        letter-spacing: 0.5px;
        flex: 1;
      }

      .btn-add-top {
        background: transparent;
        border: 1px solid var(--divider);
        color: var(--ink-faint);
        border-radius: 8px;
        padding: 8px 14px;
        min-height: var(--tap);
        font-size: 14px;
        cursor: pointer;
        font-family: "Noto Sans SC", sans-serif;
        transition: all 0.15s;
        letter-spacing: 0.5px;
      }

      .btn-add-top:hover {
        border-color: var(--gold-light);
        color: var(--gold);
        background: var(--gold-pale);
      }

      /* ── Paragraph card ── */
      .para-card {
        background: white;
        border: 1px solid var(--divider);
        border-radius: var(--radius);
        margin-bottom: 14px;
        overflow: hidden;
        box-shadow: 0 2px 8px var(--shadow);
      }

      .card-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        row-gap: 6px;
        padding: 8px 12px;
        background: var(--paper-warm);
        border-bottom: 1px solid var(--divider);
      }

      .card-num {
        font-size: 14px;
        font-weight: 600;
        color: var(--gold);
        letter-spacing: 1px;
        background: rgba(184, 145, 42, 0.12);
        border: 1px solid rgba(184, 145, 42, 0.28);
        border-radius: 6px;
        padding: 4px 10px;
        flex-shrink: 0;
      }

      .card-head-title {
        flex: 1;
        font-size: 13px;
        color: var(--ink-faint);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 60px;
      }

      .btn-del {
        background: none;
        border: 1px solid rgba(200, 50, 50, 0.35);
        color: #c84040;
        border-radius: 6px;
        padding: 6px 12px;
        min-height: 34px;
        font-size: 14px;
        cursor: pointer;
        flex-shrink: 0;
        white-space: nowrap;
        transition: all 0.15s;
        font-family: "Noto Sans SC", sans-serif;
      }

      .btn-del:hover {
        background: rgba(200, 50, 50, 0.1);
      }

      .card-head-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        justify-content: flex-end;
      }

      .btn-move {
        background: none;
        border: 1px solid var(--divider);
        color: var(--ink-faint);
        border-radius: 6px;
        padding: 6px 12px;
        min-height: 34px;
        font-size: 14px;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.15s;
        line-height: 1.4;
        font-family: "Noto Sans SC", sans-serif;
      }

      .btn-move:hover:not(:disabled) {
        border-color: var(--gold-light);
        color: var(--gold);
        background: var(--gold-pale);
      }

      .btn-move:disabled {
        opacity: 0.3;
        cursor: default;
      }

      .btn-insert {
        background: none;
        border: 1px solid rgba(58, 96, 64, 0.45);
        color: var(--green);
        border-radius: 6px;
        padding: 6px 12px;
        min-height: 34px;
        font-size: 14px;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.15s;
        line-height: 1.4;
        font-family: "Noto Sans SC", sans-serif;
      }

      .btn-insert:hover {
        background: rgba(58, 96, 64, 0.1);
      }

      .card-body {
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .field-row {
        display: grid;
        grid-template-columns: 160px 1fr 140px;
        gap: 10px;
      }

      .field-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .field-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--gold);
        letter-spacing: 1px;
      }

      .field-select,
      .field-input {
        background: var(--paper);
        border: 1px solid var(--divider);
        border-radius: 8px;
        padding: 12px 14px;
        min-height: var(--tap);
        font-family: "Noto Sans SC", sans-serif;
        font-size: 17px;
        color: var(--ink);
        outline: none;
        transition:
          border-color 0.15s,
          background 0.15s;
        width: 100%;
      }

      .field-select:focus,
      .field-input:focus {
        border-color: var(--gold-light);
        background: white;
      }

      .field-textarea {
        background: var(--paper);
        border: 1px solid var(--divider);
        border-radius: 8px;
        padding: 12px 14px;
        font-family: "Noto Serif SC", serif;
        font-size: 18px;
        line-height: 1.85;
        color: var(--ink);
        outline: none;
        resize: vertical;
        width: 100%;
        overflow: hidden;
        min-height: 130px;
        transition:
          border-color 0.15s,
          background 0.15s;
      }

      .field-textarea:focus {
        border-color: var(--gold-light);
        background: white;
      }

      .field-textarea.explanation {
        font-family: "Noto Sans SC", sans-serif;
        font-size: 17px;
        line-height: 1.9;
        color: var(--green);
        border-style: dashed;
        min-height: 130px;
      }

      /* ── Title-category card accent ── */
      .para-card.card-title {
        border-left: 4px solid var(--green);
      }

      .para-card.card-title .card-head {
        background: #eef4ef;
      }

      .para-card.card-title .card-num {
        color: var(--green);
        background: rgba(58, 96, 64, 0.1);
        border-color: rgba(58, 96, 64, 0.25);
      }

      /* ── Add paragraph button ── */
      .btn-add {
        display: block;
        width: 100%;
        padding: 10px;
        min-height: var(--tap);
        background: transparent;
        border: 2px dashed var(--divider);
        border-radius: var(--radius);
        color: var(--ink-faint);
        font-family: "Noto Sans SC", sans-serif;
        font-size: 15px;
        cursor: pointer;
        text-align: center;
        transition: all 0.15s;
        letter-spacing: 1px;
        margin-top: 6px;
      }

      .btn-add:hover {
        border-color: var(--gold-light);
        color: var(--gold);
        background: var(--gold-pale);
      }

      /* ── Bottom action bar ── */
      .action-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--paper-warm);
        border-top: 2px solid var(--divider);
        padding: 8px 16px;
        padding-bottom: calc(8px + env(safe-area-inset-bottom));
        box-shadow: 0 -4px 24px var(--shadow);
        z-index: 90;
      }

      .action-bar-inner {
        max-width: 920px;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .btn-save-draft {
        background: transparent;
        color: var(--gold);
        border: 1px solid var(--gold);
        border-radius: 8px;
        padding: 6px 10px;
        min-height: 40px;
        font-family: "Noto Sans SC", sans-serif;
        font-size: 13px;
        cursor: pointer;
        letter-spacing: 0.5px;
        transition: background 0.15s;
        flex: 1 1 90px;
        text-align: center;
      }

      .btn-save-draft:hover {
        background: var(--gold-pale);
      }

      .btn-gen-slide {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--green);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 6px 10px;
        min-height: 40px;
        font-family: "Noto Sans SC", sans-serif;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        letter-spacing: 0.5px;
        flex: 1.6 1 130px;
        transition:
          background 0.15s,
          transform 0.1s;
      }

      .btn-gen-slide:hover {
        background: var(--green-light);
      }

      .btn-gen-slide:active {
        transform: scale(0.98);
      }

      /* ── Empty state ── */
      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--ink-faint);
        font-size: 17px;
        line-height: 2.2;
      }

      .empty-state .icon {
        font-size: 48px;
        opacity: 0.3;
        margin-bottom: 12px;
      }

      /* ── Toast ── */
      .toast {
        position: fixed;
        top: 72px;
        left: 50%;
        transform: translateX(-50%) translateY(-16px);
        background: rgba(26, 18, 8, 0.92);
        color: #f0e4c0;
        padding: 12px 24px;
        border-radius: 10px;
        font-size: 16px;
        font-family: "Noto Sans SC", sans-serif;
        opacity: 0;
        transition:
          opacity 0.22s,
          transform 0.22s;
        pointer-events: none;
        z-index: 999;
        white-space: nowrap;
        max-width: 90vw;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* ── Responsive ── */
      @media (max-width: 700px) {
        .field-row {
          grid-template-columns: 1fr 1fr;
        }

        .field-row .field-group:nth-child(2) {
          grid-column: 1 / -1;
          order: -1;
        }

        .meta-inner {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 480px) {
        .field-row {
          grid-template-columns: 1fr;
        }

        .card-head-actions {
          justify-content: flex-start;
          flex-basis: 100%;
        }

        .btn-move,
        .btn-insert,
        .btn-del {
          flex: 1 1 auto;
        }

        main {
          padding-bottom: 140px;
        }
      }
    </style>
  </head>

  <body>
    <div class="top-bar">
      <button class="btn-back" onclick="history.back()">← 返回</button>
      <span class="top-title" id="topTitle">广论消文编辑器</span>
    </div>

    <div class="meta-section">
      <div class="meta-inner">
        <div class="meta-fields">
          <div class="meta-row">
            <span class="meta-label">标题 TITLE</span>
            <input
              class="meta-input"
              id="metaTitle"
              type="text"
              placeholder="P102L11 - P104L10 念佛道理---常白净行"
            />
          </div>
          <div class="meta-row">
            <span class="meta-label">副标题 SUBTITLE</span>
            <input
              class="meta-input"
              id="metaSubtitle"
              type="text"
              placeholder="（可选）"
            />
          </div>
        </div>
        <div class="meta-date-col">
          <div class="meta-row">
            <span class="meta-label">日期 DATE</span>
            <input
              class="meta-input"
              id="metaDate"
              type="text"
              placeholder="DD/MM/YYYY"
            />
          </div>
        </div>
      </div>
    </div>

    <main>
      <div class="list-header">
        <span class="list-count" id="listCount">共 0 个段落</span>
        <button class="btn-add-top" onclick="addPara()">＋ 新增段落</button>
      </div>
      <div id="paraList"></div>
      <button class="btn-add" onclick="addPara()">＋ 新增段落</button>
    </main>

    <div class="action-bar">
      <div class="action-bar-inner">
        <button class="btn-save-draft" onclick="saveDraft()">保存草稿</button>
        <button class="btn-save-draft" onclick="syncFromSlide()">
          从Slide同步
        </button>
        <button class="btn-gen-slide" onclick="generateSlide()">
          生成幻灯片 ▶
        </button>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      let paras = [];

      function showToast(msg, duration) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), duration || 2000);
      }

      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function loadData() {
        try {
          const raw = localStorage.getItem("guanglun_editor_input");
          if (!raw) {
            showToast("未找到数据，请从广论阅读器点击「生成消文」", 4000);
            return;
          }
          const data = JSON.parse(raw);
          document.getElementById("metaTitle").value = data.title || "";
          document.getElementById("metaSubtitle").value = data.subtitle || "";
          document.getElementById("metaDate").value = data.testdate || "";
          document.getElementById("topTitle").textContent =
            data.title || "广论消文编辑器";
          paras = data.paragraph
            ? data.paragraph.map((p) => Object.assign({}, p))
            : [];
          renderList();
        } catch (e) {
          showToast("数据解析失败：" + e.message, 4000);
        }
      }

      function renderList() {
        const list = document.getElementById("paraList");
        if (!paras.length) {
          list.innerHTML =
            '<div class="empty-state"><div class="icon">📄</div>尚无段落，点击「新增段落」开始编辑</div>';
          updateCount();
          return;
        }
        list.innerHTML = "";
        paras.forEach((p, i) => list.appendChild(createCard(p, i)));
        updateCount();
        list.querySelectorAll(".field-textarea").forEach(autoResize);
      }

      // Grows the box to fit what's typed so nobody has to drag the tiny resize handle.
      function autoResize(el) {
        el.style.height = "auto";
        el.style.height = el.scrollHeight + "px";
      }

      function createCard(p, i) {
        const isTitle = p.category === "title";
        const card = document.createElement("div");
        card.className = "para-card" + (isTitle ? " card-title" : "");
        card.dataset.index = i;

        const catOptions = ["content", "title"]
          .map(
            (v) =>
              `<option value="${v}"${p.category === v ? " selected" : ""}>${v === "content" ? "内容 content" : "标题 title"}</option>`,
          )
          .join("");

        const headLabel = isTitle ? "封面" : `# ${i + 1}`;
        const headTitle = isTitle
          ? esc(p.mainTitle || "")
          : esc(p.pageTitle || "");

        let bodyFields;
        if (isTitle) {
          bodyFields = `
          <div class="field-row" style="grid-template-columns:160px 1fr;">
            <div class="field-group">
              <span class="field-label">CATEGORY 类型</span>
              <select class="field-select" onchange="changeCategory(${i},this.value)">
                ${catOptions}
              </select>
            </div>
            <div class="field-group">
              <span class="field-label">MAIN TITLE 主标题</span>
              <input class="field-input" type="text" value="${esc(p.mainTitle || "")}"
                oninput="updateField(${i},'mainTitle',this.value)"
                placeholder="广论消文">
            </div>
          </div>
          <div class="field-group">
            <span class="field-label">SUB TITLE 副标题（换行用 Enter）</span>
            <textarea class="field-textarea" rows="2"
              oninput="updateField(${i},'subTitle',this.value); autoResize(this)">${esc(p.subTitle || "")}</textarea>
          </div>`;
        } else {
          bodyFields = `
          <div class="field-row">
            <div class="field-group">
              <span class="field-label">CATEGORY 类型</span>
              <select class="field-select" onchange="changeCategory(${i},this.value)">
                ${catOptions}
              </select>
            </div>
            <div class="field-group">
              <span class="field-label">PAGE TITLE 页面标题</span>
              <input class="field-input" type="text" value="${esc(p.pageTitle || "")}"
                oninput="updateField(${i},'pageTitle',this.value)"
                placeholder="P102L11-L13 此是略说---现为教授">
            </div>
            <div class="field-group">
              <span class="field-label">PERSON 负责人</span>
              <input class="field-input" type="text" value="${esc(p.personInCharge || "")}"
                oninput="updateField(${i},'personInCharge',this.value)"
                placeholder="AL">
            </div>
          </div>
          <div class="field-group">
            <span class="field-label">ORIGINAL TEXT 原文</span>
            <textarea class="field-textarea" rows="3"
              oninput="updateField(${i},'originalText',this.value); autoResize(this)">${esc(p.originalText || "")}</textarea>
          </div>
          <div class="field-group">
            <span class="field-label">EXPLANATION 消文</span>
            <textarea class="field-textarea explanation" rows="3"
              oninput="updateField(${i},'explanation',this.value); autoResize(this)">${esc(p.explanation || "")}</textarea>
          </div>`;
        }

        const n = paras.length;
        card.innerHTML = `
        <div class="card-head">
          <span class="card-num">${headLabel}</span>
          <span class="card-head-title" id="cht-${i}">${headTitle}</span>
          <div class="card-head-actions">
            <button class="btn-move" onclick="movePara(${i},-1)" ${i === 0 ? "disabled" : ""} title="上移">▲ 上移</button>
            <button class="btn-move" onclick="movePara(${i},+1)" ${i === n - 1 ? "disabled" : ""} title="下移">▼ 下移</button>
            <button class="btn-insert" onclick="insertAfter(${i})" title="在此后插入新段落">＋ 插入</button>
            <button class="btn-del" onclick="deletePara(${i})">🗑 删除</button>
          </div>
        </div>
        <div class="card-body">${bodyFields}</div>
      `;
        return card;
      }

      function changeCategory(i, value) {
        paras[i].category = value;
        const oldCard = document.querySelector(`.para-card[data-index="${i}"]`);
        if (oldCard) oldCard.replaceWith(createCard(paras[i], i));
      }

      function updateField(i, field, value) {
        paras[i][field] = value;
        if (field === "pageTitle" || field === "mainTitle") {
          const el = document.getElementById("cht-" + i);
          if (el) el.textContent = value;
        }
      }

      function deletePara(i) {
        if (!confirm(`确认删除第 ${i + 1} 段落？`)) return;
        paras.splice(i, 1);
        renderList();
      }

      function movePara(i, dir) {
        const j = i + dir;
        if (j < 0 || j >= paras.length) return;
        [paras[i], paras[j]] = [paras[j], paras[i]];
        renderList();
        setTimeout(() => {
          const cards = document.querySelectorAll(".para-card");
          if (cards[j])
            cards[j].scrollIntoView({ behavior: "smooth", block: "nearest" });
        }, 60);
      }

      function insertAfter(i) {
        paras.splice(i + 1, 0, {
          category: "content",
          pageTitle: "",
          personInCharge: "",
          originalText: "",
          explanation: "",
        });
        renderList();
        setTimeout(() => {
          const cards = document.querySelectorAll(".para-card");
          if (cards[i + 1])
            cards[i + 1].scrollIntoView({
              behavior: "smooth",
              block: "center",
            });
        }, 60);
      }

      function addPara() {
        paras.push({
          category: "content",
          pageTitle: "",
          personInCharge: "",
          originalText: "",
          explanation: "",
        });
        renderList();
        setTimeout(() => {
          const cards = document.querySelectorAll(".para-card");
          if (cards.length)
            cards[cards.length - 1].scrollIntoView({
              behavior: "smooth",
              block: "center",
            });
        }, 60);
      }

      function updateCount() {
        const n = paras.length;
        document.getElementById("listCount").textContent = `共 ${n} 个段落`;
      }

      function currentData() {
        return {
          title: document.getElementById("metaTitle").value,
          subtitle: document.getElementById("metaSubtitle").value,
          testdate: document.getElementById("metaDate").value,
          paragraph: paras,
        };
      }

      function saveDraft() {
        localStorage.setItem(
          "guanglun_editor_input",
          JSON.stringify(currentData()),
        );
        showToast("草稿已保存 ✓", 1800);
      }

      // Backend: CloudBackendService (D:\Shared\Projects_Local\CloudBackendService).
      // POST /api/documents/{id} -> passkey required (fixed, not prompted); the
      // server rejects it with 401 if it doesn't match Auth:PasskeyHash.
      const CLOUD_CONFIG = {
        baseUrl: "https://open.seawayapp.com",
        passkey: "GuangLun",
      };

      // Title looks like "P119L1 - P122L13 前四句---后四句"; the id is just
      // the page/line range, e.g. "P119L1-P122L13" (as set by guanglun_reader_v2.html).
      function deriveDocumentId() {
        const title = (document.getElementById("metaTitle").value || "").trim();
        const m = title.match(/P\d+L\d+\s*-\s*P\d+L\d+/);
        if (m) return m[0].replace(/\s+/g, "");
        return title ? title.replace(/\s+/g, "_") : `untitled-${Date.now()}`;
      }

      // Every cloud save is a brand-new item, never an overwrite of a previous
      // one, so the id carries a to-the-second timestamp: P111L9-P113L8-YYYYMMDD-HHMMSS.
      function deriveCloudSaveId() {
        const d = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        const stamp = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
        return `${deriveDocumentId()}-${stamp}`;
      }

      function syncFromSlide() {
        const raw = localStorage.getItem("guanglun_slide_localdata");
        if (!raw) {
          showToast("未找到 Slide 数据", 2500);
          return;
        }
        if (!confirm("将用 guanglun_slide_localdata 覆盖当前编辑内容，继续？"))
          return;
        localStorage.setItem("guanglun_editor_input", raw);
        loadData();
        showToast("已从 Slide 数据同步 ✓", 1800);
      }

      function generateSlide() {
        const data = currentData();

        console.log(JSON.stringify(data));
        localStorage.setItem("guanglun_slide_localdata", JSON.stringify(data));
        saveToCloudSilently(data);
        showToast("已保存，正在打开幻灯片…", 1500);
        setTimeout(
          () =>
            window.open("template_textslide_v2.html?input=localdata", "_blank"),
          500,
        );
      }

      // Silent cloud sync, no prompt — fixed passkey, new timestamped id every time.
      function saveToCloudSilently(data) {
        const id = deriveCloudSaveId();
        fetch(`${CLOUD_CONFIG.baseUrl}/api/documents/${id}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ passkey: CLOUD_CONFIG.passkey, data }),
        })
          .then((res) => {
            if (!res.ok)
              console.error(`云端自动保存失败：服务器返回 ${res.status}`);
          })
          .catch((e) => console.error("云端自动保存失败：", e));
      }

      loadData();
    </script>
  </body>
</html>
