<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="data/compositions.js"></script>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var id = params.get("id");
        var piece = (window.COMPOSITIONS_DATA || []).find(function (c) {
          return c.id === id;
        });
        window.NAV_CONFIG = {
          breadcrumbs: [
            { label: "Home", href: "../../../../index.html" },
            { label: "Education", href: "../../../index.html" },
            { label: "PSLE", href: "../../index.html" },
            { label: "EL", href: "../index.html" },
            { label: "Compositions", href: "index.html" },
            { label: piece ? piece.title : "Read" },
          ],
        };
      })();
    </script>
    <script src="../../../../nav-top.js"></script>
    <meta
      name="description"
      content="Read a PSLE English composition with good phrases highlighted for easy, read-aloud practice."
    />
    <title>Composition — Read</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1a1208;
        --ink-mid: #4a3c28;
        --ink-light: #8a7a62;
        --paper: #f5f0e8;
        --gold: #b8912a;
        --gold-light: #d4aa4a;
        --gold-dim: rgba(184, 145, 42, 0.12);
        --border: rgba(184, 145, 42, 0.28);
        --shadow: rgba(80, 60, 20, 0.12);
        --radius: 10px;
        --read-size: 1.15rem;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Noto Serif SC", "Book Antiqua", "Palatino Linotype", Georgia, serif;
        background: var(--paper);
        color: var(--ink);
        min-height: 100vh;
      }

      .wrap {
        width: 80%;
        margin: 0 auto;
        padding: 32px 24px 64px;
      }

      @media (max-width: 700px) {
        .wrap {
          width: 100%;
        }
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: system-ui, sans-serif;
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--ink-light);
        text-decoration: none;
        margin-bottom: 22px;
      }

      .back-link:hover {
        color: var(--gold);
      }

      header.piece-head {
        margin-bottom: 8px;
      }

      header.piece-head h1 {
        font-size: 1.7rem;
        font-weight: 700;
        line-height: 1.3;
        color: var(--ink);
      }

      .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-top: 12px;
        font-family: system-ui, sans-serif;
      }

      .tag {
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--gold);
        background: var(--gold-dim);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 3px 10px;
      }

      .meta-date {
        font-size: 0.78rem;
        color: var(--ink-light);
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin: 22px 0 4px;
        padding: 10px 14px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-family: system-ui, sans-serif;
      }

      .toolbar .legend {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.76rem;
        color: var(--ink-light);
      }

      .toolbar .legend mark {
        font-size: 0.76rem;
      }

      .font-ctrl {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .font-ctrl button {
        width: 28px;
        height: 28px;
        border: 1px solid var(--border);
        background: #fff;
        color: var(--ink-mid);
        border-radius: 6px;
        font-size: 0.9rem;
        font-weight: 700;
        cursor: pointer;
        line-height: 1;
      }

      .font-ctrl button:hover {
        border-color: var(--gold);
        color: var(--gold);
      }

      article.piece {
        margin-top: 26px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 2px 14px var(--shadow);
        padding: 34px clamp(20px, 5vw, 46px);
      }

      article.piece p {
        font-size: var(--read-size);
        line-height: 1.95;
        color: var(--ink);
        margin-bottom: 1.15em;
        transition: font-size 0.15s;
      }

      article.piece p:last-child {
        margin-bottom: 0;
      }

      article.piece mark {
        background: #b5e6a2;
        color: #2a1f0a;
        padding: 0 3px;
        border-radius: 3px;
        font-weight: 600;
      }

      article.piece em {
        font-style: italic;
        color: var(--ink-mid);
      }

      .techniques {
        margin-top: 22px;
        padding: 16px 18px;
        background: var(--gold-dim);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        font-family: system-ui, sans-serif;
      }

      .techniques h2 {
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--ink-mid);
        margin-bottom: 8px;
      }

      .techniques ul {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .techniques li {
        font-size: 0.78rem;
        color: var(--ink-mid);
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 4px 12px;
      }

      .not-found {
        text-align: center;
        padding: 60px 20px;
        color: var(--ink-light);
        font-family: system-ui, sans-serif;
      }

      .not-found a {
        color: var(--gold);
      }

      .update-date {
        text-align: center;
        margin-top: 40px;
        font-size: 0.78rem;
        color: var(--ink-light);
        font-family: system-ui, sans-serif;
      }

      @media (max-width: 480px) {
        .wrap {
          padding: 24px 16px 48px;
        }

        header.piece-head h1 {
          font-size: 1.35rem;
        }

        article.piece {
          padding: 24px 18px;
        }
      }
    </style>
  </head>

  <body>
    <main class="wrap">
      <a class="back-link" href="index.html">&larr; Back to Compositions</a>

      <div id="content"></div>
    </main>

    <footer class="update-date" aria-label="Last updated">
      Last updated on 09/08/2026
    </footer>

    <script>
      function escapeHtml(str) {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function renderInline(text) {
        let html = escapeHtml(text);
        html = html.replace(/\*\*(.+?)\*\*/g, "<mark>$1</mark>");
        html = html.replace(/\*(.+?)\*/g, "<em>$1</em>");
        return html;
      }

      function wordCount(paragraphs) {
        const plain = paragraphs.join(" ").replace(/[*_]/g, "");
        return plain.split(/\s+/).filter(Boolean).length;
      }

      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      const data = window.COMPOSITIONS_DATA || [];
      const piece = data.find(function (c) {
        return c.id === id;
      });
      const root = document.getElementById("content");

      if (!piece) {
        root.innerHTML =
          '<div class="not-found">' +
          "<p>We couldn't find that composition.</p>" +
          '<p style="margin-top:10px;"><a href="index.html">&larr; Back to Compositions</a></p>' +
          "</div>";
      } else {
        document.title = piece.title + " — Composition";
        const words = wordCount(piece.paragraphs);

        let techniquesHtml = "";
        if (piece.techniques && piece.techniques.length) {
          techniquesHtml =
            '<div class="techniques"><h2>Writing techniques to notice</h2><ul>' +
            piece.techniques
              .map(function (t) {
                return "<li>" + escapeHtml(t) + "</li>";
              })
              .join("") +
            "</ul></div>";
        }

        root.innerHTML =
          '<header class="piece-head">' +
          "<h1>" +
          escapeHtml(piece.title) +
          "</h1>" +
          '<div class="meta-row">' +
          '<span class="tag">' +
          escapeHtml(piece.genre || "Composition") +
          "</span>" +
          '<span class="meta-date">' +
          escapeHtml(piece.theme || "") +
          " &middot; " +
          words +
          " words</span>" +
          "</div>" +
          "</header>" +
          '<div class="toolbar">' +
          '<div class="legend"><mark>highlight</mark> = good phrase worth reusing</div>' +
          '<div class="font-ctrl">' +
          '<button type="button" id="font-dec" aria-label="Smaller text">A&minus;</button>' +
          '<button type="button" id="font-inc" aria-label="Larger text">A+</button>' +
          "</div>" +
          "</div>" +
          '<article class="piece">' +
          piece.paragraphs
            .map(function (p) {
              return "<p>" + renderInline(p) + "</p>";
            })
            .join("") +
          "</article>" +
          techniquesHtml;

        let size = 1.15;
        const rootEl = document.documentElement;
        document
          .getElementById("font-inc")
          .addEventListener("click", function () {
            size = Math.min(1.6, size + 0.1);
            rootEl.style.setProperty("--read-size", size + "rem");
          });
        document
          .getElementById("font-dec")
          .addEventListener("click", function () {
            size = Math.max(0.95, size - 0.1);
            rootEl.style.setProperty("--read-size", size + "rem");
          });
      }
    </script>
  </body>
</html>
