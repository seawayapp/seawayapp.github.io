<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    window.NAV_CONFIG = {
      breadcrumbs: [
        { label: "Home", href: "../../../../index.html" },
        { label: "Education", href: "../../../index.html" },
        { label: "PSLE", href: "../../index.html" },
        { label: "EL", href: "../index.html" },
        { label: "Vocabulary Cloze" }
      ]
    };
  </script>
  <script src="../../../../nav-top.js"></script>
  <meta name="description" content="PSLE English Vocabulary Cloze practice — choose the closest synonym, with instant answer-key marking.">
  <title>PSLE — Vocabulary Cloze</title>
  <style>
    :root {
      --ink: #1f2b23;
      --ink-mid: #4a5c4f;
      --ink-light: #7c8f80;
      --paper: #faf7ef;
      --card: #ffffff;
      --forest: #3a6b52;
      --forest-dim: rgba(58, 107, 82, .10);
      --forest-line: rgba(58, 107, 82, .28);
      --gold: #c99a3d;
      --gold-dim: rgba(201, 154, 61, .14);
      --good: #2f8a4e;
      --good-bg: #e7f5ea;
      --bad: #c1483c;
      --bad-bg: #fbeae8;
      --shadow: rgba(40, 60, 45, .10);
      --radius: 12px;
    }

    * , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, "Book Antiqua", "Palatino Linotype", serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
    }

    .wrap {
      max-width: 880px;
      margin: 0 auto;
      padding: 32px 20px 72px;
    }

    header.page-head {
      text-align: center;
      margin-bottom: 22px;
    }

    header.page-head h1 {
      font-size: 1.7rem;
      color: var(--forest);
      letter-spacing: .02em;
    }

    header.page-head .sub {
      margin-top: 6px;
      font-family: system-ui, sans-serif;
      font-size: .85rem;
      color: var(--ink-light);
    }

    .leaf-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 14px 0 26px;
      color: var(--gold);
    }
    .leaf-divider svg { width: 20px; height: 20px; }
    .leaf-divider .line { flex: 0 0 60px; height: 1px; background: var(--forest-line); }

    select#passageSelect {
      display: block;
      margin: 0 auto 20px;
      font-family: system-ui, sans-serif;
      font-size: .85rem;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--forest-line);
      background: var(--card);
      color: var(--ink);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--forest-line);
      border-radius: var(--radius);
      box-shadow: 0 6px 20px var(--shadow);
      padding: 26px 26px 22px;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 1.15rem;
      color: var(--forest);
      margin-bottom: 6px;
    }

    .instructions {
      font-family: system-ui, sans-serif;
      font-size: .82rem;
      line-height: 1.55;
      color: var(--ink-mid);
      background: var(--forest-dim);
      border-left: 3px solid var(--forest);
      padding: 12px 14px;
      border-radius: 6px;
      margin: 12px 0 4px;
    }

    .marks-badge {
      float: right;
      font-family: system-ui, sans-serif;
      font-size: .72rem;
      font-weight: 700;
      color: var(--forest);
      background: var(--gold-dim);
      border: 1px solid var(--gold);
      border-radius: 20px;
      padding: 3px 12px;
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin: 14px 0 4px;
    }

    .top-actions .action {
      padding: 7px 14px;
      font-size: .78rem;
    }

    .passage {
      font-size: 1.05rem;
      line-height: 2.05;
      margin-top: 14px;
      padding-bottom: 18px;
      border-bottom: 1px dashed var(--forest-line);
    }

    .passage p { margin-bottom: 16px; }

    .uword {
      font-weight: 700;
      color: var(--ink);
      text-decoration: underline;
      text-decoration-style: solid;
      text-decoration-color: var(--forest-line);
      text-underline-offset: 3px;
    }

    .uword .qnum {
      font-size: .6rem;
      font-weight: 800;
      color: var(--gold);
      vertical-align: super;
      margin-left: 1px;
      text-decoration: none;
    }

    .reveal-tag {
      font-size: .78rem;
      font-weight: 800;
      color: var(--good);
      margin-left: 3px;
      text-decoration: none;
      white-space: nowrap;
    }

    .mcq-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 18px;
    }

    .mcq-block {
      border: 1px solid var(--forest-line);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .mcq-head {
      font-family: system-ui, sans-serif;
      font-size: .82rem;
      font-weight: 700;
      color: var(--forest);
      margin-bottom: 8px;
    }

    .mcq-head .word {
      color: var(--ink);
      font-weight: 600;
      font-style: italic;
    }

    .mcq-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .opt {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: system-ui, sans-serif;
      font-size: .82rem;
      text-align: left;
      padding: 7px 10px;
      border-radius: 7px;
      border: 1.5px solid var(--forest-line);
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      transition: all .15s;
    }

    .opt:hover:not(:disabled) { border-color: var(--gold); background: var(--gold-dim); }

    .opt .opt-num {
      font-weight: 800;
      color: var(--forest);
      flex-shrink: 0;
    }

    .opt.selected {
      border-color: var(--gold);
      background: var(--gold-dim);
      box-shadow: 0 0 0 2px var(--gold-dim);
    }

    .opt.correct {
      border-color: var(--good);
      background: var(--good-bg);
      color: var(--good);
      font-weight: 700;
    }

    .opt.correct .opt-num { color: var(--good); }

    .opt.incorrect {
      border-color: var(--bad);
      background: var(--bad-bg);
      color: var(--bad);
    }

    .opt:disabled { cursor: default; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 22px;
      font-family: system-ui, sans-serif;
    }

    button.action {
      font-family: system-ui, sans-serif;
      font-size: .85rem;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: transform .1s, box-shadow .15s;
    }

    button.action:active { transform: translateY(1px); }

    .btn-check { background: var(--forest); color: #fff; }
    .btn-check:hover { box-shadow: 0 4px 14px rgba(58,107,82,.35); }

    .btn-results { background: var(--gold); color: #fff; }
    .btn-results:hover { box-shadow: 0 4px 14px rgba(201,154,61,.4); }

    .btn-explain { background: var(--gold-dim); color: var(--forest); border: 1px solid var(--gold); }
    .btn-reset { background: transparent; color: var(--bad); border: 1px solid var(--bad); }

    .score-pill {
      margin-left: auto;
      font-family: system-ui, sans-serif;
      font-weight: 700;
      font-size: .9rem;
      color: var(--forest);
      background: var(--forest-dim);
      border-radius: 20px;
      padding: 8px 16px;
    }

    .score-pill .best {
      display: block;
      font-size: .68rem;
      font-weight: 500;
      color: var(--ink-light);
    }

    .explanations {
      margin-top: 18px;
      display: none;
      font-family: system-ui, sans-serif;
    }

    .explanations.show { display: block; }

    .explain-row {
      display: flex;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px dashed var(--forest-line);
      font-size: .82rem;
    }
    .explain-row:last-child { border-bottom: none; }

    .explain-num {
      flex: 0 0 30px;
      font-weight: 800;
      color: var(--forest);
    }

    .explain-ans {
      flex: 0 0 110px;
      font-weight: 700;
      color: var(--gold);
    }

    .explain-note { flex: 1; color: var(--ink-mid); line-height: 1.5; }
    .explain-note .cn { display: block; color: var(--ink-light); margin-top: 2px; }

    .credit {
      margin-top: 16px;
      font-family: system-ui, sans-serif;
      font-size: .72rem;
      color: var(--ink-light);
      font-style: italic;
      text-align: right;
    }

    .update-date {
      text-align: center;
      margin-top: 40px;
      font-size: .78rem;
      color: var(--ink-light);
      font-family: system-ui, sans-serif;
    }

    @media (max-width: 640px) {
      .card { padding: 18px 16px 16px; }
      .passage { font-size: .98rem; line-height: 2.15; }
      .mcq-grid { grid-template-columns: 1fr; }
      .score-pill { margin-left: 0; width: 100%; text-align: center; }
      .toolbar { flex-direction: column; align-items: stretch; }
      button.action { width: 100%; }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <header class="page-head">
      <h1>PSLE Vocabulary Cloze</h1>
      <div class="sub">Choose the word closest in meaning to each underlined word</div>
    </header>

    <div class="leaf-divider">
      <div class="line"></div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M12 2C7 6 4 10 4 14a8 8 0 0 0 16 0c0-4-3-8-8-12Z" />
        <path d="M12 6v14" />
      </svg>
      <div class="line"></div>
    </div>

    <select id="passageSelect" aria-label="Choose passage"></select>

    <section class="card">
      <span class="marks-badge" id="marksBadge"></span>
      <h2 id="passageTitle"></h2>
      <div class="instructions" id="instructions"></div>

      <div class="top-actions">
        <button class="action btn-results" id="btnResultsTop">Show Results</button>
        <button class="action btn-reset" id="btnResetTop">Reset</button>
      </div>

      <div class="passage" id="passage"></div>

      <div class="mcq-grid" id="mcqGrid"></div>

      <div class="toolbar">
        <button class="action btn-check" id="btnCheck">Check Answers</button>
        <button class="action btn-results" id="btnResults">Show Results</button>
        <button class="action btn-explain" id="btnExplain">Show Explanations</button>
        <button class="action btn-reset" id="btnReset">Reset</button>
        <div class="score-pill" id="scorePill" style="display:none;"></div>
      </div>

      <div class="explanations" id="explanations"></div>

      <div class="credit" id="credit"></div>
    </section>
  </main>

  <footer class="update-date" aria-label="Last updated">
    Last updated on 14/09/2026
  </footer>

  <script src="data/vc_passages.js"></script>
  <script>
    (function () {
      const state = {
        passage: null,
        picks: {},      // qNum -> option index (1-based)
        checked: false,
        resultsMode: false
      };

      const els = {
        select: document.getElementById('passageSelect'),
        title: document.getElementById('passageTitle'),
        marks: document.getElementById('marksBadge'),
        instructions: document.getElementById('instructions'),
        passage: document.getElementById('passage'),
        mcqGrid: document.getElementById('mcqGrid'),
        btnCheck: document.getElementById('btnCheck'),
        btnResults: document.getElementById('btnResults'),
        btnResultsTop: document.getElementById('btnResultsTop'),
        btnExplain: document.getElementById('btnExplain'),
        btnReset: document.getElementById('btnReset'),
        btnResetTop: document.getElementById('btnResetTop'),
        scorePill: document.getElementById('scorePill'),
        explanations: document.getElementById('explanations'),
        credit: document.getElementById('credit')
      };

      function storageKey(p) { return 'vc_best_' + p.id; }

      function loadPassage(p) {
        state.passage = p;
        state.picks = {};
        state.checked = false;
        state.resultsMode = false;

        els.title.textContent = p.title + '  ·  ' + p.source;
        els.marks.textContent = '(' + p.marks + ' marks)';
        els.instructions.textContent = p.instructions;
        els.credit.textContent = p.credit || '';
        els.scorePill.style.display = 'none';
        els.explanations.classList.remove('show');
        els.btnExplain.textContent = 'Show Explanations';

        renderPassage();
        renderMcq();
      }

      function renderPassage() {
        const p = state.passage;
        const paras = p.text.split('\n\n');
        els.passage.innerHTML = paras.map(para => {
          const html = para.replace(/\{\{(\d+)\|([^}]+)\}\}/g, (m, numStr, phrase) => {
            return uwordHtml(parseInt(numStr, 10), phrase);
          });
          return '<p>' + html + '</p>';
        }).join('');
      }

      function uwordHtml(num, phrase) {
        const q = state.passage.questions.find(q => q.num === num);
        let tag = '';
        if (state.resultsMode && q) {
          tag = '<span class="reveal-tag">(' + q.options[q.answer - 1] + ')</span>';
        }
        return '<span class="uword">' + phrase + '<sup class="qnum">' + num + '</sup></span>' + tag;
      }

      function renderMcq() {
        const p = state.passage;
        els.mcqGrid.innerHTML = p.questions.map(q => {
          const pick = state.picks[q.num];
          const opts = q.options.map((opt, i) => {
            const idx = i + 1;
            let cls = 'opt';
            if (state.resultsMode) {
              if (idx === q.answer) cls += ' correct';
            } else if (state.checked) {
              if (idx === q.answer) cls += ' correct';
              else if (pick === idx) cls += ' incorrect';
            } else if (pick === idx) {
              cls += ' selected';
            }
            const disabled = (state.checked || state.resultsMode) ? 'disabled' : '';
            return '<button class="' + cls + '" data-q="' + q.num + '" data-opt="' + idx + '" ' + disabled + '>' +
              '<span class="opt-num">(' + idx + ')</span>' + opt + '</button>';
          }).join('');
          return '<div class="mcq-block">' +
            '<div class="mcq-head">' + q.num + '. <span class="word">' + q.phrase + '</span></div>' +
            '<div class="mcq-options">' + opts + '</div>' +
            '</div>';
        }).join('');

        els.mcqGrid.querySelectorAll('.opt').forEach(el => {
          el.addEventListener('click', () => onOptClick(parseInt(el.dataset.q, 10), parseInt(el.dataset.opt, 10)));
        });
      }

      function onOptClick(qNum, opt) {
        if (state.checked || state.resultsMode) return;
        state.picks[qNum] = (state.picks[qNum] === opt) ? undefined : opt;
        renderMcq();
      }

      function checkAnswers() {
        if (state.resultsMode) return;
        const p = state.passage;
        let score = 0;
        p.questions.forEach(q => {
          if (state.picks[q.num] === q.answer) score++;
        });
        state.checked = true;
        renderMcq();

        const best = parseInt(localStorage.getItem(storageKey(p)) || '0', 10);
        const newBest = Math.max(best, score);
        localStorage.setItem(storageKey(p), String(newBest));

        els.scorePill.style.display = 'block';
        els.scorePill.innerHTML = 'Score: ' + score + ' / ' + p.questions.length +
          '<span class="best">Best: ' + newBest + ' / ' + p.questions.length + '</span>';
      }

      function showResults() {
        state.resultsMode = true;
        state.checked = false;
        els.scorePill.style.display = 'none';
        renderPassage();
        renderMcq();
      }

      function renderExplanations() {
        const p = state.passage;
        els.explanations.innerHTML = p.questions.map(q => {
          return '<div class="explain-row">' +
            '<div class="explain-num">' + q.num + '</div>' +
            '<div class="explain-ans">(' + q.answer + ') ' + q.options[q.answer - 1] + '</div>' +
            '<div class="explain-note">' + q.note_en + '<span class="cn">' + (q.note_cn || '') + '</span></div>' +
            '</div>';
        }).join('');
      }

      function reset() {
        state.picks = {};
        state.checked = false;
        state.resultsMode = false;
        els.scorePill.style.display = 'none';
        els.explanations.classList.remove('show');
        els.btnExplain.textContent = 'Show Explanations';
        renderPassage();
        renderMcq();
      }

      els.btnCheck.addEventListener('click', checkAnswers);
      els.btnResults.addEventListener('click', showResults);
      els.btnResultsTop.addEventListener('click', showResults);
      els.btnReset.addEventListener('click', reset);
      els.btnResetTop.addEventListener('click', reset);
      els.btnExplain.addEventListener('click', () => {
        renderExplanations();
        els.explanations.classList.toggle('show');
        els.btnExplain.textContent = els.explanations.classList.contains('show')
          ? 'Hide Explanations' : 'Show Explanations';
      });

      els.select.innerHTML = VC_PASSAGES.map((p, i) =>
        '<option value="' + i + '">' + p.source + ' — ' + p.title + '</option>'
      ).join('');
      els.select.addEventListener('change', () => loadPassage(VC_PASSAGES[parseInt(els.select.value, 10)]));

      loadPassage(VC_PASSAGES[0]);
    })();
  </script>
</body>

</html>
