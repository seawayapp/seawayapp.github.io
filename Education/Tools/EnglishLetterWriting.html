<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script src="../../nav-top.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>两线英文字帖 · Letter Writing</title>
<style>
  :root { --ink:#1f1f1f; --grey:#c9c9c9; --accent:#2b6cb0; --red:#e0412b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
         background:#f4f6f8; color:#222; }
  header { background:#fff; border-bottom:1px solid #e3e6ea; padding:12px 20px; display:flex;
           align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:20px; margin:0; }
  nav button { border:1px solid #cfd6de; background:#fff; padding:7px 16px; border-radius:18px;
               cursor:pointer; font-size:14px; margin-right:6px; }
  nav button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { max-width:1400px; margin:0 auto; padding:16px; display:grid;
         grid-template-columns:minmax(0,1fr) 460px; gap:16px; align-items:start; }
  /* the animation stays in view while choosing letters on the right */
  .stagecard { position:sticky; top:calc(var(--navh, 0px) + 10px); margin-bottom:0; }
  .side .card:last-child { margin-bottom:0; }
  @media (max-width: 960px) {
    main { grid-template-columns:1fr; padding:10px; gap:10px; }
    .stagecard { top:var(--navh, 0px); z-index:5; padding:10px; border-radius:0 0 12px 12px;
                 box-shadow:0 4px 14px rgba(0,0,0,.12); }
    #stage { max-height:34vh !important; }
    .stagecard .row { gap:6px; }
    .stagecard .btn { padding:7px 12px; }
  }
  .card { background:#fff; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.05);
          padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .btn { border:none; background:var(--accent); color:#fff; padding:9px 18px; border-radius:20px;
         cursor:pointer; font-size:14px; }
  .btn.alt { background:#2f855a; } .btn.ghost { background:#fff; color:var(--accent); border:1px solid var(--accent); }
  label.opt { font-size:13px; color:#555; display:flex; align-items:center; gap:6px; }
  #stage { width:100%; max-height:62vh; background:#fff; border:1px solid #e3e6ea; border-radius:10px; display:block; }
  .grid-title { font-weight:600; margin:12px 0 6px; color:#444; font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(50px,1fr)); gap:6px; }
  .tile { background:#fff; border:1px solid #e3e6ea; border-radius:8px; cursor:pointer; padding:2px; }
  .tile:hover { border-color:var(--accent); box-shadow:0 0 0 2px rgba(43,108,176,.15); }
  .tile.sel { border-color:var(--accent); background:#eef5fc; }
  .tile svg { width:100%; height:auto; display:block; }
  textarea { width:100%; min-height:90px; font-size:18px; padding:10px; border:1px solid #d5dbe1;
             border-radius:8px; resize:vertical; font-family:inherit; }
  .hint { font-size:12px; color:#777; }
  .num { font-size:30px; font-weight:700; fill:var(--red); opacity:0; transition:opacity .2s; }
  .num.show { opacity:1; }
  #print { display:none; }

  @page { size: A4 portrait; margin: 0; }
  @media print {
    body { background:#fff; padding-top:0 !important; }
    header, main, .__snav { display:none !important; }
    #print { display:block; }
    .sheet { width:210mm; height:297mm; page-break-after:always; break-after:page; overflow:hidden; }
    .sheet:last-child { page-break-after:auto; break-after:auto; }
    .sheet svg { width:210mm; height:297mm; display:block; }
  }
</style>
</head>
<body>
<header>
  <h1>两线英文字帖 <span style="font-weight:400;color:#888;font-size:14px">Letter Writing</span></h1>
  <nav>
    <button id="tabLetters" class="on" onclick="showTab('letters')">字母笔顺</button>
    <button id="tabWords" onclick="showTab('words')">单词练习</button>
    <button id="tabPrint" onclick="showTab('print')">打印字帖</button>
  </nav>
</header>

<main>
  <!-- animation stage (shared, sticky) -->
  <div class="card stagecard">
    <svg id="stage" viewBox="0 0 1000 410"></svg>
    <div class="row" style="margin-top:10px">
      <button class="btn" onclick="play()">▶ 播放 / 重播</button>
      <button class="btn ghost" onclick="step(-1)">◀ 上一个</button>
      <button class="btn ghost" onclick="step(1)">下一个 ▶</button>
      <label class="opt">速度 慢<input id="speed" type="range" min="60" max="900" value="320">快</label>
      <label class="opt"><input id="showNums" type="checkbox" checked> 显示笔顺数字</label>
      <label class="opt"><input id="autoNext" type="checkbox"> 自动播放下一个</label>
    </div>
  </div>

  <div class="side">
  <section id="letters">
    <div class="card">
      <div class="hint">点击字母查看笔顺动画（按字帖 1、2、3 的顺序）。也可以直接按键盘上的字母；← → 换字母，空格重播。</div>
      <div class="grid-title">大写 Capitals</div><div class="grid" id="gridCap"></div>
      <div class="grid-title">小写 Lowercase</div><div class="grid" id="gridLow"></div>
      <div class="grid-title">数字 Numbers</div><div class="grid" id="gridDig"></div>
    </div>
  </section>

  <section id="words" style="display:none">
    <div class="card">
      <div class="row" style="margin-bottom:8px">
        <label class="opt">单词表 <select id="wordList" onchange="useList(this.value)">
          <option value="">— 选择现成的单词表 —</option></select></label>
      </div>
      <textarea id="wordInput" placeholder="输入单词，用空格或换行分开">jump quiz fox black wet grey hand seven</textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn" onclick="playWords()">▶ 动画演示单词</button>
        <button class="btn alt" onclick="printWords()">🖨 打印单词字帖</button>
        <span class="hint">只支持英文字母和数字，其他符号会被忽略。</span>
      </div>
    </div>
  </section>

  <section id="print_opts" style="display:none">
    <div class="card">
      <div class="row">
        <label class="opt">灰色描红次数 <select id="traces">
          <option>0</option><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select></label>
        <label class="opt"><input id="printNums" type="checkbox" checked> 范字上标笔顺数字</label>
        <label class="opt">每个单词占 <select id="wordSlots"><option selected>1</option><option>2</option><option>3</option></select> 格</label>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn alt" onclick="printLetters()">🖨 字母字帖 Aa–Zz</button>
        <button class="btn alt" onclick="printDigits()">🖨 数字字帖 0–9</button>
        <button class="btn alt" onclick="printWords()">🖨 单词字帖</button>
        <button class="btn ghost" onclick="printBlank()">🖨 空白页</button>
      </div>
      <p class="hint">打印时选择“另存为 PDF”即可保存模板。A4 纵向，每页 16 行，两条线（虚线中线 + 实线基线），左右两栏，中间留空。
        如果打印预览出现页眉页脚，请在“更多设置”里取消“页眉和页脚”，边距选“无”。</p>
    </div>
  </section>
  </div>
</main>

<div id="print"></div>

// ------------------------------------------------------------ glyph helpers
const NS = "http://www.w3.org/2000/svg";
const TARGET_W = 15.5;                 // unified visual stroke weight (units, x-height = 100)
const extra = g => Math.max(0, TARGET_W - g.sw);
const GAP_U = 24, SPACE_U = 70;        // letter gap / word space in units

function clean(text) { return text.replace(/[^A-Za-z0-9 \n]/g, ""); }

function layoutWord(word) {
  let x = 0; const items = [];
  for (const ch of word) {
    if (ch === " ") { x += SPACE_U; continue; }
    const g = DATA[ch]; if (!g) continue;
    if (items.length) x += GAP_U;
    items.push({ ch, x, g }); x += g.w;
  }
  return { items, width: x };
}

function strokeStart(s) {
  if (s.dot) return s.dot;
  const m = s.d.match(/^M(-?[\d.]+) (-?[\d.]+)/); return [+m[1], +m[2]];
}

// label positions for stroke numbers; strokes starting at the same spot get
// their numbers side by side ("1 2"), like the chart
function numPositions(g, size) {
  const pos = [];
  g.s.forEach(st => {
    let [px, py] = strokeStart(st);
    let x = px - size * 0.75, y = py - size * 0.45;
    while (pos.some(([qx, qy]) => Math.abs(qx - x) < size * 0.8 && Math.abs(qy - y) < size * 0.9)) x += size * 0.95;
    pos.push([x, y]);
  });
  return pos;
}

// SVG string for a glyph (static). opts: color, nums(bool), scale, x, base
function glyphSVG(g, x, base, scale, color, nums, numSize) {
  const e = extra(g);
  let s = `<g transform="translate(${x.toFixed(3)} ${base.toFixed(3)}) scale(${scale})">` +
    `<path d="${g.d}" fill="${color}" stroke="${color}" stroke-width="${e}" stroke-linejoin="round"/>`;
  if (nums) {
    numPositions(g, numSize).forEach(([px, py], i) => {
      s += `<text x="${px.toFixed(1)}" y="${py.toFixed(1)}" font-size="${numSize}" fill="#e0412b" font-weight="700" ` +
           `font-family="Arial" text-anchor="middle">${i + 1}</text>`;
    });
  }
  return s + "</g>";
}

// ------------------------------------------------------------ tiles
function makeTile(ch) {
  const g = DATA[ch];
  const vbW = 260, x = (vbW - g.w) / 2, base = 240;
  const vbH = g.k === "lower" ? 390 : 262;   // only lowercase needs room below the base line
  const svg = `<svg viewBox="0 0 ${vbW} ${vbH}">
    <line x1="0" x2="${vbW}" y1="${base - 100}" y2="${base - 100}" stroke="#bbb" stroke-width="3" stroke-dasharray="10 8"/>
    <line x1="0" x2="${vbW}" y1="${base}" y2="${base}" stroke="#666" stroke-width="4"/>
    ${glyphSVG(g, x, base, 1, "#222", false)}</svg>`;
  const d = document.createElement("div");
  d.className = "tile"; d.innerHTML = svg; d.dataset.ch = ch;
  d.onclick = () => { selectChar(ch); play(); };
  return d;
}
const ORDER = [..."ABCDEFGHIJKLMNOPQRSTUVWXYZ", ..."abcdefghijklmnopqrstuvwxyz", ..."0123456789"];
[..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"].forEach(c => gridCap.appendChild(makeTile(c)));
[..."abcdefghijklmnopqrstuvwxyz"].forEach(c => gridLow.appendChild(makeTile(c)));
[..."0123456789"].forEach(c => gridDig.appendChild(makeTile(c)));

// ------------------------------------------------------------ stage + animation
const stage = document.getElementById("stage");
let current = "A", stageMode = "char", anim = null, steps = [];

function selectChar(ch) {
  current = ch; stageMode = "char";
  document.querySelectorAll(".tile").forEach(t => t.classList.toggle("sel", t.dataset.ch === ch));
  buildStage([ch]);
}
function step(dir) {
  if (stageMode !== "char") { selectChar(current); }
  const i = (ORDER.indexOf(current) + dir + ORDER.length) % ORDER.length;
  selectChar(ORDER[i]); play();
}

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e); return e;
}

// lines: array of strings, each laid out on its own two-line row
function buildStage(lines) {
  stopAnim();
  stage.innerHTML = "";
  steps = [];
  const ROWH = 410, PAD = 60;
  const lays = lines.map(layoutWord);
  const maxW = Math.max(400, ...lays.map(l => l.width));
  const vbW = Math.max(lines.length === 1 && lines[0].length === 1 ? 640 : 1400, maxW + 2 * PAD);
  stage.setAttribute("viewBox", `0 0 ${vbW} ${ROWH * lines.length}`);
  const defs = el("defs", {}, stage);
  let mid = 0;
  lays.forEach((lay, r) => {
    const base = r * ROWH + 255;
    el("line", { x1: 10, x2: vbW - 10, y1: base - 100, y2: base - 100, stroke: "#9aa5b1",
                 "stroke-width": 2.5, "stroke-dasharray": "12 9" }, stage);
    el("line", { x1: 10, x2: vbW - 10, y1: base, y2: base, stroke: "#4a5560", "stroke-width": 3.5 }, stage);
    const x0 = (vbW - lay.width) / 2;
    lay.items.forEach(it => {
      const g = it.g, e = extra(g), gx = x0 + it.x;
      const grp = el("g", { transform: `translate(${gx} ${base})` }, stage);
      el("path", { d: g.d, fill: "#e4e7eb", stroke: "#e4e7eb", "stroke-width": e, "stroke-linejoin": "round" }, grp);
      const mId = "m" + (mid++);
      const mask = el("mask", { id: mId, maskUnits: "userSpaceOnUse", x: -100, y: -400, width: g.w + 200, height: 700 }, defs);
      el("path", { d: g.d, fill: "#fff", stroke: "#fff", "stroke-width": e, "stroke-linejoin": "round" }, mask);
      const inkG = el("g", { mask: `url(#${mId})` }, grp);
      const numG = el("g", {}, grp);
      const cover = (g.sw + e) * 1.9 + 4;
      const npos = numPositions(g, 30);
      g.s.forEach((st, i) => {
        const num = el("text", { x: npos[i][0], y: npos[i][1], class: "num", "text-anchor": "middle" }, numG);
        num.textContent = i + 1;
        if (st.dot) {
          const c = el("circle", { cx: st.dot[0], cy: st.dot[1], r: 0, fill: "#1f1f1f" }, inkG);
          steps.push({ kind: "dot", c, r: (g.sw + e) * 1.6, num, gx, base });
        } else {
          const p = el("path", { d: st.d, fill: "none", stroke: "#1f1f1f", "stroke-width": cover,
                                 "stroke-linecap": "round", "stroke-linejoin": "round" }, inkG);
          const len = p.getTotalLength();
          p.style.strokeDasharray = `${len} ${len + 10}`; p.style.strokeDashoffset = len;
          steps.push({ kind: "line", p, len, num, gx, base });
        }
      });
      steps.push({ kind: "pause", ms: 350 });
    });
  });
  stage.pen = el("circle", { r: 9, fill: "#e0412b", opacity: 0 }, stage);
  if (!document.getElementById("showNums").checked) {}
  showAllNums(false);
}

function showAllNums(on) {
  steps.forEach(s => s.num && s.num.classList.toggle("show", on && showNums.checked));
}

function stopAnim() { if (anim) cancelAnimationFrame(anim); anim = null; }

function resetInk() {
  steps.forEach(s => {
    if (s.kind === "line") s.p.style.strokeDashoffset = s.len;
    if (s.kind === "dot") s.c.setAttribute("r", 0);
    if (s.num) s.num.classList.remove("show");
  });
}

function play() {
  stopAnim(); resetInk();
  let idx = 0, t0 = null, wait = 0;
  const pen = stage.pen;
  function frame(ts) {
    if (idx >= steps.length) {
      pen.setAttribute("opacity", 0); anim = null;
      if (stageMode === "char" && autoNext.checked) setTimeout(() => step(1), 700);
      return;
    }
    const s = steps[idx];
    if (t0 === null) { t0 = ts; if (s.num && showNums.checked) s.num.classList.add("show"); }
    const el_ = ts - t0;
    const speed = +document.getElementById("speed").value; // units per second
    if (s.kind === "pause") {
      if (el_ >= s.ms) { idx++; t0 = null; }
    } else if (s.kind === "dot") {
      const k = Math.min(1, el_ / 250);
      s.c.setAttribute("r", s.r / 2 * k);
      pen.setAttribute("cx", s.gx + +s.c.getAttribute("cx")); pen.setAttribute("cy", s.base + +s.c.getAttribute("cy"));
      pen.setAttribute("opacity", 1);
      if (k >= 1) { idx++; t0 = null; steps.splice(idx, 0, { kind: "pause", ms: 200 }); }
    } else {
      const dist = Math.min(s.len, el_ / 1000 * speed);
      s.p.style.strokeDashoffset = s.len - dist;
      const pt = s.p.getPointAtLength(dist);
      pen.setAttribute("cx", s.gx + pt.x); pen.setAttribute("cy", s.base + pt.y); pen.setAttribute("opacity", 1);
      if (dist >= s.len) { idx++; t0 = null; steps.splice(idx, 0, { kind: "pause", ms: 260 }); }
    }
    anim = requestAnimationFrame(frame);
  }
  // remove pauses inserted by previous runs
  steps = steps.filter(s => !(s.kind === "pause" && s.ms !== 350));
  anim = requestAnimationFrame(frame);
}
document.getElementById("showNums").onchange = () => {
  steps.forEach(s => { if (s.num && !showNums.checked) s.num.classList.remove("show"); });
};

function getWords() {
  return clean(document.getElementById("wordInput").value).split(/[\s]+/).filter(Boolean);
}
// ready-made lists (primary-school words); together they cover every letter
const WORD_LISTS = [

  ["A–Z 每个字母开头", "apple ball cat dog egg fish girl hat ice jam kite lion milk nest orange pig queen red sun tree umbrella van water box yellow zoo"],

  ["竖线高字母 (l t b h k f)", "ball tall kite fish hat bike leaf book duck milk"],
  ["先下后拱字母 (p r n m h b)", "man pen run map hen rain moon bird horn arm"],

function useList(i) {
  if (i === "") return;
  document.getElementById("wordInput").value = WORD_LISTS[+i][1];
  playWords();

function playWords() {
  const w = getWords(); if (!w.length) return;
  stageMode = "words";
  document.querySelectorAll(".tile").forEach(t => t.classList.remove("sel"));
  // pack words into rows (about 1800 units wide) so short words stay large
  const rows = []; let cur = "";
  w.slice(0, 30).forEach(word => {
    const t = cur ? cur + " " + word : word;
    if (cur && layoutWord(t).width > 1800) { rows.push(cur); cur = word; } else cur = t;
  });
  if (cur) rows.push(cur);
  buildStage(rows); play();
}

function showTab(name) {
  letters.style.display = name === "letters" ? "" : "none";
  words.style.display = name === "words" ? "" : "none";
  print_opts.style.display = name === "print" || name === "words" ? "" : "none";
  tabLetters.classList.toggle("on", name === "letters");
  tabWords.classList.toggle("on", name === "words");
  tabPrint.classList.toggle("on", name === "print");
}

// ------------------------------------------------------------ printing (mm)
const P = { W: 210, H: 297, side: 10, margin: 8, head: 13, XH: 4.2, ROW: 16.8, TALL: 2.09, GAP: 14 };
P.panel = (P.W - 2 * P.side - P.GAP) / 2;
P.rightX = P.side + P.panel + P.GAP;
P.firstBase = P.margin + P.head + P.TALL * P.XH;
P.rows = Math.floor((P.H - P.margin - 1.4 * P.XH - P.firstBase) / P.ROW) + 1;
const S = P.XH / 100;          // mm per glyph unit

function sheetHeader(title) {

  const dateL = 38;
  // keep the Name line clear of the title (bold Arial ~3.4 mm per char at 5.6 mm)
  const titleEnd = P.side + title.length * 3.4 + 16;
  const nameL = Math.max(35, Math.min(62, r - dateL - 12 - titleEnd));
  return `<text x="${P.side}" y="${ty}" font-family="Arial" font-weight="700" font-size="5.6">${title}</text>
    <text x="${r - dateL - 1}" y="${ty}" font-family="Arial" font-size="3.9" text-anchor="end">Date:</text>
    <line x1="${r - dateL}" x2="${r}" y1="${ty + .35}" y2="${ty + .35}" stroke="#000" stroke-width=".22"/>
    <text x="${r - dateL - 13 - nameL}" y="${ty}" font-family="Arial" font-size="3.9" text-anchor="end">Name:</text>
    <line x1="${r - dateL - 12 - nameL}" x2="${r - dateL - 12}" y1="${ty + .35}" y2="${ty + .35}" stroke="#000" stroke-width=".22"/>
    <line x1="${P.side}" x2="${r}" y1="${ty + 3}" y2="${ty + 3}" stroke="#000" stroke-width=".28"/>`;
}
function lines(x, w, base) {
  return `<line x1="${x}" x2="${x + w}" y1="${base}" y2="${base}" stroke="#4d4d4d" stroke-width=".32"/>
    <line x1="${x}" x2="${x + w}" y1="${base - P.XH}" y2="${base - P.XH}" stroke="#8c8c8c" stroke-width=".21" stroke-dasharray="1.06 .7"/>`;
}
// draw text (word or char) in a slot: model + traces. returns svg
function slotContent(text, x, w, base, traces, nums) {
  const lay = layoutWord(text);
  nums = nums && lay.items.length === 1;   // numbers only on single letters (words get too busy)
  const ww = lay.width * S, space = 5;
  let out = "", cx = x + 1.2;
  for (let k = 0; k <= traces; k++) {
    if (cx + ww > x + w + 0.01) break;
    const color = k === 0 ? "#1a1a1a" : "#c8c8c8";
    lay.items.forEach(it => {
      out += glyphSVG(it.g, cx + it.x * S, base, S, color, k === 0 && nums, 50);
    });
    cx += Math.max(ww, 4) + space;
  }
  return out;
}
function sheet(title, rowsContent) {
  // rowsContent: array (length <= rows) of {full?:text, left?:text, right?:text}
  const traces = +document.getElementById("traces").value;
  const nums = document.getElementById("printNums").checked;
  let s = `<div class="sheet"><svg viewBox="0 0 ${P.W} ${P.H}" xmlns="${NS}">` + sheetHeader(title);
  for (let i = 0; i < P.rows; i++) {
    const base = P.firstBase + i * P.ROW, rc = rowsContent[i] || {};
    if (rc.full) {
      s += lines(P.side, P.W - 2 * P.side, base);
      s += slotContent(rc.full, P.side, P.W - 2 * P.side, base, traces, nums);
    } else {
      s += lines(P.side, P.panel, base) + lines(P.rightX, P.panel, base);
      if (rc.left) s += slotContent(rc.left, P.side, P.panel, base, traces, nums);
      if (rc.right) s += slotContent(rc.right, P.rightX, P.panel, base, traces, nums);
    }
  }
  return s + "</svg></div>";
}
function doPrint(html) {
  const box = document.getElementById("print");
  box.innerHTML = html;
  setTimeout(() => { window.print(); }, 150);
}
window.addEventListener("afterprint", () => { document.getElementById("print").innerHTML = ""; });

function paginate(title, rows) {
  let html = "";
  for (let i = 0; i < Math.max(rows.length, 1); i += P.rows) html += sheet(title, rows.slice(i, i + P.rows));
  return html;
}
function printLetters() {
  const rows = [..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"].map(c => ({ left: c, right: c.toLowerCase() }));
  doPrint(paginate("Letters Aa - Zz", rows));
}
function printDigits() {
  const rows = [];
  for (let i = 0; i < P.rows; i++) rows.push({ left: String(i % 5), right: String(i % 5 + 5) });
  doPrint(paginate("Numbers 0 - 9", rows));
}
function printBlank() { doPrint(sheet("Practice", [])); }
function printWords() {
  const words = getWords(); if (!words.length) { alert("请先在“单词练习”里输入单词"); showTab("words"); return; }
  const slots = +document.getElementById("wordSlots").value;
  const fitsPanel = w => layoutWord(w).width * S + 2.4 <= P.panel;
  const rows = []; let pending = null;  // pending = half-filled row
  words.forEach(w => {
    for (let k = 0; k < slots; k++) {
      if (!fitsPanel(w)) { if (pending) { rows.push(pending); pending = null; } rows.push({ full: w }); continue; }
      if (pending) { pending.right = w; rows.push(pending); pending = null; }
      else pending = { left: w };
    }
  });
  if (pending) rows.push(pending);
  doPrint(paginate("Word Practice", rows));
}

// keyboard: type a letter to see it; arrows = previous / next; space = replay
document.addEventListener("keydown", e => {
  const t = e.target;
  if ((t instanceof Element && t.closest("textarea, input, select")) || e.ctrlKey || e.metaKey || e.altKey) return;
  if (DATA[e.key]) { selectChar(e.key); play(); e.preventDefault(); }
  else if (e.key === "ArrowRight") { step(1); e.preventDefault(); }
  else if (e.key === "ArrowLeft") { step(-1); e.preventDefault(); }
  else if (e.key === " ") { play(); e.preventDefault(); }
});

// a fixed site navigation bar (when hosted on the website) must not cover the sticky stage
function syncNavHeight() {
  const nav = document.querySelector(".__snav");
  document.documentElement.style.setProperty("--navh", (nav ? nav.offsetHeight : 0) + "px");
}
window.addEventListener("load", syncNavHeight);
window.addEventListener("resize", syncNavHeight);

// ------------------------------------------------------------ init
selectChar("A");
setTimeout(play, 300);
</script>
