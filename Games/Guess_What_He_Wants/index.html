<style>
  :root {
    --sky-top: #eaf6ff;
    --sky-bottom: #fff6df;
    --ink: #3b3358;
    --ink-soft: #6c6284;
    --card: #ffffff;
    --sun: #ffc94a;
    --coral: #ff6f61;
    --mint: #34c98f;
    --mint-deep: #1f9d70;
    --lav: #eef0ff;
    --shadow: rgba(59, 51, 88, 0.16);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Nunito', 'PingFang SC', 'Microsoft Yahei', sans-serif;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 28px 16px 60px;
    color: var(--ink);
    overflow-x: hidden;
  }

  .app { width: 100%; max-width: 460px; }

  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .brand {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 19px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .brand .en { font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-left: 2px; }
  .brand span.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--sun); display: inline-block; flex-shrink:0; }

  .counter {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: var(--ink-soft);
    background: white;
    padding: 4px 10px;
    border-radius: 999px;
    box-shadow: 0 2px 6px var(--shadow);
  }

  .progress-track {
    height: 8px;
    background: #e4e0f5;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--sun), #ffb14a);
    border-radius: 999px;
    transition: width .4s ease;
  }

  .stage {
    position: relative;
    background: var(--card);
    border-radius: 28px;
    box-shadow: 0 18px 40px var(--shadow);
    padding: 22px 20px 26px;
    overflow: hidden;
  }

  .bubble {
    background: var(--lav);
    border-radius: 18px 18px 18px 4px;
    padding: 12px 16px;
    margin-bottom: 16px;
  }
  .bubble .zh {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 17px;
    line-height: 1.5;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .bubble .en {
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 3px;
  }
  .speak-btn {
    border: none;
    background: none;
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 2px;
    flex-shrink: 0;
    opacity: 0.75;
  }
  .speak-btn:hover { opacity: 1; }

  .scene-frame {
    border-radius: 20px;
    background: linear-gradient(180deg, #fdf9ee, #f4efe0);
    padding: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
    position: relative;
    min-height: 200px;
  }
  .scene-frame img {
    max-width: 100%;
    max-height: 250px;
    display: block;
    animation: breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }
  .scene-frame.correct-pop img { animation: pop 0.7s ease; }
  @keyframes pop {
    0% { transform: scale(1) rotate(0); }
    30% { transform: scale(1.12) rotate(-4deg); }
    55% { transform: scale(0.98) rotate(3deg); }
    75% { transform: scale(1.05) rotate(-1deg); }
    100% { transform: scale(1) rotate(0); }
  }
  .scene-frame.wrong-shake img { animation: nudge 0.5s ease; }
  @keyframes nudge {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-5px) rotate(-1deg); }
    75% { transform: translateX(5px) rotate(1deg); }
  }

  /* Type A: stacked option rows */
  .options { display: flex; flex-direction: column; gap: 12px; }
  .opt {
    display: flex; align-items: center; gap: 14px;
    background: #fbfaff; border: 2px solid #e7e2f7; border-radius: 18px;
    padding: 10px 16px 10px 10px; cursor: pointer;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
    text-align: left; font-family: 'Nunito', sans-serif;
  }
  .opt:hover { transform: translateY(-2px); border-color: #cfc4f2; }
  .opt img { width: 56px; height: 56px; object-fit: contain; flex-shrink: 0; }
  .opt .labels { display: flex; flex-direction: column; }
  .opt .zh { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 16px; color: var(--ink); }
  .opt .en { font-size: 12px; color: var(--ink-soft); }
  .opt.correct-answer { background: #e9fbf3; border-color: var(--mint); }
  .opt.wrong-pick { background: #fff0ee; border-color: var(--coral); animation: nudge 0.5s ease; }
  .opt.disabled { pointer-events: none; opacity: 0.55; }
  .opt.disabled.correct-answer { opacity: 1; }

  /* Type B: side-by-side compare cards */
  .compare { display: flex; gap: 12px; }
  .cmp-card {
    flex: 1; background: #fbfaff; border: 2px solid #e7e2f7; border-radius: 18px;
    padding: 10px; cursor: pointer; text-align: center;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .cmp-card:hover { transform: translateY(-2px); border-color: #cfc4f2; }
  .cmp-card img { width: 100%; max-height: 220px; object-fit: contain; display: block; }
  .cmp-card.correct-answer { background: #e9fbf3; border-color: var(--mint); }
  .cmp-card.wrong-pick { background: #fff0ee; border-color: var(--coral); animation: nudge 0.5s ease; }
  .cmp-card.disabled { pointer-events: none; opacity: 0.55; }
  .cmp-card.disabled.correct-answer { opacity: 1; }

  .feedback { margin-top: 16px; max-height: 0; overflow: hidden; transition: max-height .35s ease; }
  .feedback.show { max-height: 260px; }
  .feedback-inner { border-radius: 16px; padding: 14px 16px; font-size: 14.5px; line-height: 1.55; }
  .feedback-inner .en-line { display:block; margin-top: 4px; opacity: 0.85; font-size: 13px; }
  .feedback-inner.good { background: #e9fbf3; color: var(--mint-deep); }
  .feedback-inner.oops { background: #fff2ea; color: #c25a2c; }
  .feedback-title { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 16px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }

  .next-btn {
    margin-top: 14px; width: 100%; border: none; border-radius: 16px; padding: 14px;
    font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 16px;
    background: var(--mint); color: white; cursor: pointer; display: none;
  }
  .next-btn.show { display: block; }
  .next-btn:active { transform: scale(0.98); }

  .done-screen { text-align: center; padding: 26px 10px 10px; }
  .done-screen .big-emoji { font-size: 54px; display: block; margin-bottom: 10px; }
  .done-screen h2 { font-family: 'Baloo 2', sans-serif; margin: 0 0 4px; }
  .done-screen .en-sub { color: var(--ink-soft); margin: 0 0 4px; font-size: 14px; }
  .done-screen p.zh-sub { color: var(--ink-soft); margin: 6px 0 18px; }
  .restart-btn {
    border: none; border-radius: 16px; padding: 12px 22px; background: var(--sun);
    color: #4a3300; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 15px; cursor: pointer;
  }

  .confetti {
    position: absolute; top: -10px; width: 8px; height: 14px; border-radius: 2px;
    animation: fall linear forwards; pointer-events: none;
  }
  @keyframes fall { to { transform: translateY(320px) rotate(340deg); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .scene-frame img, .opt, .cmp-card, .next-btn, .confetti { animation: none !important; transition: none !important; }
  }
</style>
</head>

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildShuffledQuestions() {
  return shuffleArray(QUESTIONS).map(q => {
    if (q.type === 'A') {
      return { ...q, options: shuffleArray(q.options) };
    }
    return Math.random() < 0.5 ? { ...q, left: q.right, right: q.left } : { ...q };
  });
}

let questions = buildShuffledQuestions();
let current = 0;
let answered = false;

const stage = document.getElementById('stage');
const counterEl = document.getElementById('counter');
const progressFill = document.getElementById('progressFill');

function updateProgress() {
  counterEl.textContent = `${current + 1} / ${questions.length}`;
  progressFill.style.width = `${(current / questions.length) * 100}%`;
}

function speakZh(text) {
  if (!('speechSynthesis' in window) || !text) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'zh-CN';
  const voices = window.speechSynthesis.getVoices();
  const zhVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('zh'));
  if (zhVoice) utter.voice = zhVoice;
  window.speechSynthesis.speak(utter);
}

function renderQuestion() {
  answered = false;
  const q = questions[current];
  updateProgress();

  const bubbleHtml = `
    <div class="bubble">
      <div class="zh">${q.promptZh} <button class="speak-btn" id="speakBtn" aria-label="Play Chinese audio">🔊</button></div>
      <div class="en">${q.promptEn}</div>
    </div>`;

  if (q.type === 'A') {
    stage.innerHTML = `
      ${bubbleHtml}
      <div class="scene-frame" id="sceneFrame">
        <img src="${q.sceneImg}" alt="scene">
      </div>
      <div class="options" id="options">
        ${q.options.map(o => `
          <button class="opt" data-id="${o.id}">
            <img src="${o.img}" alt="${o.zh}">
            <span class="labels"><span class="zh">${o.zh}</span><span class="en">${o.en}</span></span>
          </button>
        `).join('')}
      </div>
      <div class="feedback" id="feedback"><div class="feedback-inner" id="feedbackInner"></div></div>
      <button class="next-btn" id="nextBtn">下一题 Next →</button>
    `;
    document.querySelectorAll('.opt').forEach(btn => {
      btn.addEventListener('click', () => handlePickA(btn, q));
    });
  } else {
    stage.innerHTML = `
      ${bubbleHtml}
      <div class="compare" id="options">
        <div class="cmp-card" data-side="left"><img src="${q.left.img}" alt="left"></div>
        <div class="cmp-card" data-side="right"><img src="${q.right.img}" alt="right"></div>
      </div>
      <div class="feedback" id="feedback"><div class="feedback-inner" id="feedbackInner"></div></div>
      <button class="next-btn" id="nextBtn">下一题 Next →</button>
    `;
    document.querySelectorAll('.cmp-card').forEach(card => {
      card.addEventListener('click', () => handlePickB(card, q));
    });
  }

  document.getElementById('nextBtn').addEventListener('click', goNext);
  document.getElementById('speakBtn').addEventListener('click', () => speakZh(q.promptZh));
  speakZh(q.promptZh);
}

function showFeedback(correct, q) {
  const feedback = document.getElementById('feedback');
  const feedbackInner = document.getElementById('feedbackInner');
  const nextBtn = document.getElementById('nextBtn');
  if (correct) {
    feedbackInner.className = 'feedback-inner good';
    feedbackInner.innerHTML = `<div class="feedback-title">🎉 答对啦！ Correct!</div>${q.whyZh}<span class="en-line">${q.whyEn}</span>`;
    nextBtn.classList.add('show');
    nextBtn.textContent = (current === questions.length - 1) ? '看看结果 See Result →' : '下一题 Next →';
  } else {
    feedbackInner.className = 'feedback-inner oops';
    feedbackInner.innerHTML = `<div class="feedback-title">🤔 再想一想～ Try again</div>看看图片里的线索，仔细观察一下吧！<span class="en-line">Look closely at the clues in the picture!</span>`;
  }
  feedback.classList.add('show');
}

function launchConfetti(container) {
  const colors = ['#ff6f61', '#ffc94a', '#34c98f', '#7aa7ff', '#c58bff'];
  for (let i = 0; i < 22; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[i % colors.length];
    piece.style.animationDuration = (0.8 + Math.random() * 0.6) + 's';
    piece.style.animationDelay = (Math.random() * 0.2) + 's';
    container.appendChild(piece);
    setTimeout(() => piece.remove(), 1600);
  }
}

function handlePickA(btn, q) {
  if (answered) return;
  const id = btn.dataset.id;
  const picked = q.options.find(o => o.id === id);
  const sceneFrame = document.getElementById('sceneFrame');

  if (picked.correct) {
    answered = true;
    btn.classList.add('correct-answer');
    document.querySelectorAll('.opt').forEach(b => b.classList.add('disabled'));
    sceneFrame.classList.add('correct-pop');
    launchConfetti(sceneFrame);
    showFeedback(true, q);
  } else {
    btn.classList.add('wrong-pick');
    sceneFrame.classList.remove('wrong-shake');
    void sceneFrame.offsetWidth;
    sceneFrame.classList.add('wrong-shake');
    showFeedback(false, q);
    setTimeout(() => btn.classList.remove('wrong-pick'), 500);
  }
}

function handlePickB(card, q) {
  if (answered) return;
  const side = card.dataset.side;
  const picked = q[side];
  const options = document.getElementById('options');

  if (picked.correct) {
    answered = true;
    card.classList.add('correct-answer');
    document.querySelectorAll('.cmp-card').forEach(c => c.classList.add('disabled'));
    card.classList.add('correct-pop');
    launchConfetti(options);
    showFeedback(true, q);
  } else {
    card.classList.add('wrong-pick');
    showFeedback(false, q);
    setTimeout(() => card.classList.remove('wrong-pick'), 500);
  }
}

function goNext() {
  current++;
  if (current >= questions.length) {
    renderDone();
  } else {
    renderQuestion();
  }
}

function renderDone() {
  progressFill.style.width = '100%';
  counterEl.textContent = `${questions.length} / ${questions.length}`;
  stage.innerHTML = `
    <div class="done-screen">
      <span class="big-emoji">🌟</span>
      <h2>你都答对啦！</h2>
      <p class="en-sub">You got them all!</p>
      <p class="zh-sub">观察得真仔细，是个小小侦探！<br><span style="font-size:13px;">You're a great detective — nice observing!</span></p>
      <button class="restart-btn" id="restartBtn">再玩一次 Play Again</button>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', () => {
    questions = buildShuffledQuestions();
    current = 0;
    renderQuestion();
  });
}

renderQuestion();
</script>
</body>
</html>
